worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream workout_app {
        server workout:3000;
    }

    upstream sync_service {
        server sync:1234;
    }

    server {
        listen 80;
        server_name _;

        # Trust X-Forwarded-For only from the upstream reverse proxy / docker
        # network — never the open internet, or clients can spoof their IP and
        # bypass per-IP rate limits. Widen these CIDRs only to match your proxy.
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;

        # WebSocket sync — strip /sync prefix, forward to sync:1234
        location /sync/ {
            proxy_pass http://sync_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400s;
        }

        # Next.js app
        location / {
            proxy_pass http://workout_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
