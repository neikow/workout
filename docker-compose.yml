services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workout
      POSTGRES_PASSWORD: workout
      POSTGRES_DB: workout
    ports:
      - "5432:5432"
    volumes:
      - workout-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout -d workout"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  sync:
    build:
      context: .
      dockerfile: services/sync/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://workout:workout@postgres:5432/workout
      SYNC_TOKEN_SECRET: ${SYNC_TOKEN_SECRET:?SYNC_TOKEN_SECRET required}
      SYNC_PORT: "1234"
    ports:
      - "1234:1234"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  workout-db:
